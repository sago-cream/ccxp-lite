name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Install browser test runtime
        run: bunx playwright install --with-deps chromium

      - name: Test native work-log submissions
        run: bun run test:browser

      - name: Build extensions
        run: bun run build

      - name: Build component catalog
        run: bun run storybook:build

      - name: Check component catalog in Chromium
        run: bun run test:design

  browser-parity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          path: head

      - name: Check out base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install head dependencies
        working-directory: head
        run: bun install --frozen-lockfile

      - name: Install base dependencies
        working-directory: base
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: head
        run: bunx playwright install --with-deps chromium

      - name: Build packaged extensions
        run: |
          cd base && bun run build:crx
          cd ../head && bun run build:crx

      - name: Compare packaged browser output
        id: browser-parity
        env:
          ALLOW_VISUAL_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'accept-visual-change') }}
        working-directory: head
        run: |
          expected_changes=()
          # Use behavioral assertions only while introducing the results section.
          # Once it exists in the base, subsequent PRs use strict pixel parity again.
          if ! grep -q 'function renderResults()' ../base/src/work-log/locale.ts &&
             grep -q 'function renderResults()' src/work-log/locale.ts; then
            expected_changes+=(--expect-search-results-change)
          fi
          bun run test:browser-parity -- \
            --base-extension ../base/dist/crx/unpacked \
            --head-extension dist/crx/unpacked \
            --output ../browser-parity \
            "${expected_changes[@]}"

      - name: Upload browser parity differences
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-parity
          path: browser-parity
          if-no-files-found: ignore
